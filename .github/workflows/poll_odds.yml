name: Live Odds Total Monitor
on:
  schedule:
    # Runs every 20 minutes
    - cron: '*/20 * * * *'
  workflow_dispatch: # Allows you to click "Run workflow" manually to test
    inputs:
      send_test_email:
        description: "Send a test email (proves the Gmail login + receiver work, even with no alerts)"
        required: false
        default: false
        type: boolean
permissions:
  contents: write
jobs:
  check-odds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run odds monitor
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          TEST_EMAIL: ${{ inputs.send_test_email }}
        run: python monitor.py
      - name: Save pregame & alert state
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update state" && git push)
